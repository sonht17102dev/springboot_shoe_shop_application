spring.application.name=e-commerce-webapp-spring-boot
spring.datasource.url=jdbc:mysql://localhost:3306/spring_shoe_store_ecommerce
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.properties.dialect.hibernate=org.hibernate.dialect.MySQL8Dialect
# spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.show_sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.thymeleaf.enabled=true
spring.thymeleaf.encoding=UTF-8

spring.main.allow-bean-definition-overriding=true


spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB