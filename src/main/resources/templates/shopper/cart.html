<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="utf-8">
	<title>Giỏ hàng của tôi</title>
	<meta name="keywords" content="TopShoe">
	<meta name="description" content="TopShoe - Cart">
	<meta name="author" content="TopShoe">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<base th:replace="~{shopper/fragments/common :: base}">
	<link rel="shortcut icon" href="favicon.ico">
	<link rel="stylesheet" href="css/theme.css">
	<link rel="stylesheet" href="css/custom.css">
	<link
		href='http://fonts.googleapis.com/css?family=Roboto:400,100,100italic,300,300italic,400italic,500,500italic,700,700italic,900italic,900'
		rel='stylesheet' type='text/css'>
	<link rel="stylesheet" href="css/toastr.min.css">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>

<body>

	<!-- header -->
	<header th:replace="~{shopper/fragments/header}"></header>
	<div th:replace="~{shopper/fragments/modal :: deleteAllCart}"></div>

	<div class="tt-breadcrumb">
		<div class="container">
			<ul>
				<li><a href="/index">Trang Chủ</a></li>
				<li>Giỏ Hàng</li>
			</ul>
		</div>
	</div>
	<div id="tt-pageContent">
		<div class="container-indent">
			<div class="container">
				<h1 class="tt-title-subpages noborder">GIỎ HÀNG</h1>
				<div class="tt-shopcart-table-02">
					<table>
						<tbody>
							<tr th:each="cartItem : ${cartItems}" th:with="product = ${cartItem.productSize.product}">
								<div th:replace="~{shopper/fragments/modal :: deleteItemCart}"></div>
								<td>
									<div class="tt-product-img">
										<img th:data-src="'/assets/images/'+${product.primaryImage()}" alt="">
									</div>
								</td>
								<td>
									<h2 class="tt-title" th:text="${product.name}">
										<a href="#">name</a>
									</h2>
									<ul class="tt-list-description">
										<li>Size: <span th:text="${cartItem.productSize.size}"></span></li>
										<li>Version: <span th:text="${product.versionName}"></span></li>
									</ul>
									<ul class="tt-list-parameters">
										<li>
											<div class="tt-price" th:text="${product.formatPrice()}">
												price mobile
											</div>
										</li>
										<li>
											<div class="detach-quantity-mobile"></div>
										</li>
										<li>
											<div class="tt-price subtotal"
												th:text="${cartItem.formatPrice(product.price * cartItem.quantity)}">
												sub total mobile
											</div>
										</li>
									</ul>
								</td>
								<td>
									<div class="tt-price" th:text="${product.formatPrice()}">
										price
									</div>
								</td>
								<td>
									<div class="detach-quantity-desctope">
										<div class="tt-input-counter style-01" style="user-select: none;">

											<a th:href="@{/change-quantity?id=} + ${cartItem.id} + '&change=minus'"><span
													class="minus-btn"></span></a>
											<input type="text" th:value="${cartItem.quantity}" size="5"
												style="cursor: default;" readonly>
											<a th:href="@{/change-quantity?id=} + ${cartItem.id} + '&change=plus'"><span
													class="plus-btn"></span></a>

										</div>
									</div>
								</td>
								<td>
									<!-- <div class="tt-price subtotal" th:text="${cartItem.formatPrice(product.price * cartItem.quantity)}" >
									sub total
								</div> -->
								</td>
								<td>
									<button type="button" data-bs-toggle="modal"
										th:data-bs-target="'#deleteItemCartModal'+${cartItem.id}"
										class="tt-btn-close"></button>
								</td>
							</tr>
						</tbody>
					</table>
					<div class="tt-shopcart-btn">
						<div class="col-left">
							<a class="btn-link" href="/index"><i class="icon-e-19"></i>Tiếp tục mua sắm</a>
						</div>
						<div class="col-right">
							<button id="deleteAll" type="button" data-bs-toggle="modal" data-bs-target="#deleteAllModal"
								class="btn-link"><i class="icon-h-02"></i>Xóa hết</button>
							<!-- 						<a class="btn-link" href="#"><i class="icon-h-48"></i>UPDATE CART</a> -->
						</div>
					</div>
				</div>
				<div class="tt-shopcart-col">
					<form id="checkout_info" th:method="post" th:action="@{/checkout}" class="form-default"
						th:object="${orderWebDto}">
						<div class="row">
							<div class="col-md-6 col-lg-4">
								<div class="tt-shopcart-box">
									<h4 class="tt-title">
										Thông tin giao hàng
									</h4>
									<div class="form-group">
										<label for="consignee">Người nhận hàng <sup>*</sup></label>
										<input minlength="2" type="text" th:value="${customer.name}"
											th:field="*{consignee}"  placeholder="Nhập họ tên"
											class="form-control" required>
										<div class="help-block">
											<p th:if="${#fields.hasErrors('consignee')}" th:errors="*{consignee}"></p>
										</div>
									</div>
									<div class="form-group">
										<label for="phone">Điện thoại <sup>*</sup></label>

										<input minlength="8" pattern="[0-9]*" th:value="${customer.phone}"
											oninvalid="this.setCustomValidity('Số điện thoại không hợp lệ')"
											oninput="this.setCustomValidity('')" type="tel" 
											th:field="*{consigneePhone}" class="form-control" 
											placeholder="Nhập điện thoại" required>
										<div class="help-block">
											<p th:if="${#fields.hasErrors('consigneePhone')}" th:errors="*{consigneePhone}"></p>
										</div>
									</div>
									<div class="form-group">
										<label minlength="2" for="address">Địa chỉ <sup>*</sup></label>
										<textarea minlength="5" class="form-control" th:text="${customer.address}"
											th:field="*{deliveryAddress}"  rows="3"
											placeholder="Nhập địa chỉ giao hàng" required></textarea>
										<div class="help-block">
											<p th:if="${#fields.hasErrors('deliveryAddress')}" th:errors="*{deliveryAddress}"></p>
										</div>
									</div>
									<div>

										<input type="hidden" id="totalAmount" name="totalAmount"
											th:field="*{totalAmount}" th:value="${totalAmount}">
										<input type="hidden" id="customerId" name="customerId" th:field="*{customerId}"
											th:value="${customer.id}">
									
									</div>

									<ul class="tt-list-dot list-dot-large">
										<li><span class="check_info">Kiểm tra lại thông tin của bạn trước khi đặt
												mua</span></li>
									</ul>

								</div>
							</div>
							<div class="col-md-6 col-lg-4">
								<div class="tt-shopcart-box">
									<h4 class="tt-title">
										Phương thức thanh toán
									</h4>
									<br>
									<!-- 							<p>Add special instructions for your order...</p> -->
									<div class="radio checkbox-group">
										<input type="checkbox" id="checkATM" name="checkbox" th:field="*{paymentMethod}" th:value="ATM">
										<label for="checkATM">
											<span class="check"></span>
											<span class="box"></span>
											Thẻ ATM nội địa/Internet Banking
										</label>
									</div>
									<br>
									<div class="radio checkbox-group">
										<input type="checkbox" id="checkCOD" name="checkbox" th:field="*{paymentMethod}" th:value="COD">
										<label for="checkCOD">
											<span class="check"></span>
											<span class="box"></span>
											Thanh toán tiền mặt khi nhận hàng
										</label>
									</div>
								</div>
							</div>
							<div class="col-md-6 col-lg-4">
								<div class="tt-shopcart-box tt-boredr-large">
									<table class="tt-shopcart-table01">
										<tbody>
											<!-- 									<tr> -->
											<!-- 										<th>SUBTOTAL</th> -->
											<!-- 										<td>$324</td> -->
											<!-- 									</tr> -->
										</tbody>
										<tfoot>
											<tr>
												<th>THÀNH TIỀN</th>
												<td id="totalAmount" th:text="${totalAmount}">total</td>
											</tr>
										</tfoot>
									</table>
									<button id="submitCheckout" class="btn btn-lg">
										<span class="icon icon-check_circle"></span>
										ĐẶT MUA
									</button>
								</div>
							</div>
						</div>
					</form>
				</div>
			</div>
		</div>
	</div>

	<!-- footer -->
	<footer th:replace="~{shopper/fragments/footer}"></footer>

	<!-- modal -->
	<!-- <div th:replace="~{shopper/fragments/modal :: addToCart}"></div> -->
	<div th:replace="~{shopper/fragments/modal :: quickView}"></div>
	<div th:replace="~{shopper/fragments/modal :: subsribeGood}"></div>


	<script src="external/jquery/jquery.min.js"></script>
	<script src="external/bootstrap/js/bootstrap.min.js"></script>
	<script src="external/slick/slick.min.js"></script>
	<script src="external/panelmenu/panelmenu.js"></script>
	<script src="external/lazyLoad/lazyload.min.js"></script>
	<script src="js/main.js"></script>
	<script src="js/cart.js"></script>
	<!-- form validation and sending to mail -->
	<script src="external/form/jquery.form.js"></script>
	<script src="external/form/jquery.validate.min.js"></script>
	<script src="external/form/jquery.form-init.js"></script>
	<!-- custom -->
	<script src="js/toastr.min.js" type="text/javascript"></script>
	<script src="js/header.js" type="text/javascript"></script>

	<script inline="javascript">

		$(document).ready(function () {
			// Delete all cart
			$('#deleteAllCartButton').click(function (e) {
				e.preventDefault();
				$.ajax({
					type: "POST",
					url: "/remove-all",
					success: function () {

						setTimeout(function () {
							toastr.success('Đã xóa tất cả sản phẩm trong giỏ hàng');
						}, 500); // Chờ 1 giây trước khi tải lại trang
						window.location.href = "/cart";
					},
					error: function () {
						toastr.error('Xóa tất cả sản phẩm thất bại. Vui lòng thử lại.');
					}
				});
			});
			// Delete item cart by id
			$('#deleteCartItemButton').click(function (e) {
				e.preventDefault();
				var cartItemId = $(this).data('cart-item-id');
				$.ajax({
					type: "POST",
					url: "/remove-cart/" + cartItemId,
					success: function () {
						setTimeout(function () {
							toastr.success('Đã xóa sản phẩm khỏi giỏ hàng');
						}, 500); // Chờ 1 giây trước khi tải lại trang
						window.location.href = "/cart";
					},
					error: function () {
						toastr.error('Xóa sản phẩm thất bại. Vui lòng thử lại.');
					}
				});
			});
		});

	</script>
</body>

</html>
