<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <base th:replace="~{shopper/fragments/common :: base}">
    <!-- The above 3 meta tags *must* come first in the head; any other head content must come *after* these tags -->
    <meta name="description" content="" />
    <meta name="author" content="" />
    <title>VNPAY RESPONSE</title>
   
    <link rel="shortcut icon" href="favicon.ico" />
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/toastr.min.css" />
    <!-- Custom styles for this template -->
    <!--         <link href="assets/jumbotron-narrow.css" rel="stylesheet">  -->
  </head>
  <body class="tt-page-product-single">
    <!-- header -->
    <header th:replace="~{shopper/fragments/header}"></header>
    <!--Begin display -->
    <div class="container">
      <div class="header clearfix">
        <h3 class="text-muted">VNPAY RESPONSE</h3>
      </div>
      <div class="table-responsive">
        <div class="form-group">
          <label>Mã đơn hàng:</label>
          <label th:text="${txnRef}"></label>
        </div>
        <div class="form-group">
          <label>Số tiền:</label>
          <label th:text="${amount}"></label>
        </div>
        <div class="form-group">
          <label>Nội dung thanh toán:</label>
          <label th:text="${orderInfo}"></label>
        </div>
        <div class="form-group">
          <label>Mã phản hồi (vnp_ResponseCode):</label>
          <label th:text="${responseCode}"></label>
        </div>
        <div class="form-group">
          <label>Mã GD Tại VNPAY:</label>
          <label th:text="${transactionNo}"></label>
        </div>
        <div class="form-group">
          <label>Mã Ngân hàng:</label>
          <label th:text="${bankCode}"></label>
        </div>
        <div class="form-group">
          <label>Thời gian thanh toán:</label>
          <label th:text="${payDate}"></label>
        </div>
        <div class="form-group">
          <label>Kết quả:</label>

          <!-- Thay vì scriptlet if else -->
          <span th:if="${responseCode == '00'}" style="color: #2eb82e"
            >GD Thành công</span
          >
          <span th:if="${responseCode != '00'}" style="color: #ff3333"
            >GD Không thành công</span
          >
        </div>
      </div>

      <!-- footer -->
      <footer th:replace="~{shopper/fragments/footer}"></footer>
    </div>
    <script src="external/jquery/jquery.min.js"></script>
	<script src="external/bootstrap/js/bootstrap.min.js"></script>
	<script src="external/elevatezoom/jquery.elevatezoom.js"></script>
	<script src="external/slick/slick.min.js"></script>
	<script src="external/panelmenu/panelmenu.js"></script>
	<script src="external/air-sticky/air-sticky-block.min.js"></script>
	<script src="external/countdown/jquery.plugin.min.js"></script>
	<script src="external/countdown/jquery.countdown.min.js"></script>
	<script src="external/magnific-popup/jquery.magnific-popup.min.js"></script>
	<script src="external/lazyLoad/lazyload.min.js"></script>
	<script src="js/main.js"></script>
	<!-- form validation and sending to mail -->
	<script src="external/form/jquery.form.js"></script>
	<script src="external/form/jquery.validate.min.js"></script>
	<script src="external/form/jquery.form-init.js"></script>
	<!-- custom -->
	<script src="js/toastr.min.js" type="text/javascript"></script>
  </body>
</html>
