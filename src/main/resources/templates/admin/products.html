<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<!-- begin::Head -->

<head>
	<title>Admin | TopShoe</title>
	<th:block th:insert="~{admin/fragments/common :: global_css}"></th:block>
</head>

<!-- end::Head -->

<!-- begin::Body -->

<body
	class="kt-quick-panel--right kt-demo-panel--right kt-offcanvas-panel--right kt-header--fixed kt-header-mobile--fixed kt-subheader--enabled kt-subheader--fixed kt-subheader--solid kt-aside--enabled kt-aside--fixed kt-page--loading">

	<!-- begin:: Page -->

	<!-- begin:: Header Mobile -->
	<div th:replace="~{admin/fragments/header :: header_mobile}"></div>
	<!-- end:: Header Mobile -->

	<div class="kt-grid kt-grid--hor kt-grid--root">
		<div class="kt-grid__item kt-grid__item--fluid kt-grid kt-grid--ver kt-page">

			<!-- begin:: Aside -->
			<div th:replace="~{admin/fragments/sidebar}"></div>
			<!-- end:: Aside -->

			<div class="kt-grid__item kt-grid__item--fluid kt-grid kt-grid--hor kt-wrapper" id="kt_wrapper">

				<!-- begin:: Header -->
				<div th:replace="~{admin/fragments/header :: header}"></div>
				<!-- end:: Header -->

				<div class="kt-content  kt-grid__item kt-grid__item--fluid kt-grid kt-grid--hor" id="kt_content">

					<!-- begin :: Content -->
					<th:block th:fragment="content">
						<div class="kt-portlet kt-portlet--mobile">
							<div class="kt-portlet__head kt-portlet__head--lg">
								<div class="kt-portlet__head-label">
									<span class="kt-portlet__head-icon">
										<i class="kt-font-brand flaticon2-line-chart"></i>
									</span>
									<h3 class="kt-portlet__head-title">
										Danh Sách Sản Phẩm
									</h3>
								</div>
								<div class="kt-portlet__head-toolbar">
									<div class="kt-portlet__head-wrapper">
										<a href="#" class="btn btn-clean btn-icon-sm">
											<i class="la la-long-arrow-left"></i>
											Quay Lại
										</a>
										&nbsp;
										<div class="dropdown dropdown-inline">
											<button type="button" class="btn btn-brand btn-icon-sm" 
											onclick="redirectToAddProduct()">
												<i class="flaticon2-plus"></i> Thêm Mới
											</button>
										</div>
									</div>
								</div>
							</div>
							<div class="kt-portlet__body">

								<!--begin: Search Form -->
								<div class="kt-form kt-form--label-right kt-margin-t-20 kt-margin-b-10">
									<div class="row align-items-center">
										<div class="col-xl-8 order-2 order-xl-1">
											<div class="row align-items-center">
												<div class="col-md-4 kt-margin-b-20-tablet-and-mobile">
													<div class="kt-input-icon kt-input-icon--left">
														<input type="text" class="form-control"
															placeholder="Tìm kiếm..." id="generalSearch">
														<span class="kt-input-icon__icon kt-input-icon__icon--left">
															<span><i class="la la-search"></i></span>
														</span>
													</div>
												</div>
												<div class="col-md-4 kt-margin-b-20-tablet-and-mobile ">
													<div class="kt-form__group kt-form__group--inline">
														<div class="kt-form__label">
															<label>Trạng thái:</label>
														</div>
														<div class="kt-form__control">
															<select class="form-control bootstrap-select"
																id="kt_form_status">
																<option value="">Tất cả</option>
																<option value="1">Đang bán</option>
																<option value="2">Ngưng bán</option>
															</select>
														</div>
													</div>
												</div>
												<div class="col-md-4 kt-margin-b-20-tablet-and-mobile ">
													<div class="kt-form__group kt-form__group--inline">
														<div class="kt-form__label">
															<label>Chương trình:</label>
														</div>
														<div class="kt-form__control">
															<select class="form-control bootstrap-select"
																id="kt_form_type">
																<option value="">Tất cả</option>
																<option value="1">Giảm giá</option>
																<option value="2">Không giảm giá</option>
															</select>
														</div>
													</div>
												</div>
											</div>
										</div>
										<div class="col-xl-4 order-1 order-xl-2 kt-align-right">
											<a href="#" class="btn btn-default kt-hidden">
												<i class="la la-cart-plus"></i> New Order
											</a>
											<div
												class="kt-separator kt-separator--border-dashed kt-separator--space-lg d-xl-none">
											</div>
										</div>
									</div>
								</div>

								<!--end: Search Form -->

								<!--begin: Datatable -->
								<!-- Table data start -->
								<!-- <div class="container mt-5"> -->

								<table class="kt-datatable" id="html_table" style="width: 100%;">

								</table>
								<!-- </div> -->
								<!-- Table data end -->
							</div>
						</div>

						<!-- begin:: Footer -->
						<div th:replace="~{admin/fragments/footer}"></div>
						<!-- end:: Footer -->
				</div>
			</div>
		</div>

		<!-- end:: Page -->

		<!-- begin::Quick Panel -->
		<div th:replace="~{admin/fragments/header :: quick_panel}"></div>
		<!-- end::Quick Panel -->

		<!-- begin::Scrolltop -->
		<div id="kt_scrolltop" class="kt-scrolltop">
			<i class="fa fa-arrow-up"></i>
		</div>

		<!-- end::Scrolltop -->

		<th:block th:insert="~{admin/fragments/common :: global_script}" type="text/javascript"></th:block>
		<!-- <script src="assets/js/template/layout.js" type="text/javascript"></script> -->
		<!--begin :: Page Script (used by this page) -->
		<th:block th:fragment="page_script">
			<!-- <script src="assets/js/template/products.js" type="text/javascript"></script> -->
			<!-- <script src="assets/js/pages/crud/metronic-datatable/base/data-ajax.js" type="text/javascript"></script> -->
		</th:block>
		<!--end :: Page Script -->
		<script th:inline="javascript">
			function redirectToAddProduct() {
				window.location.href = '/admin/products/create';
			}

			$(document).ready(function () {
				var productData = [[${ products }]] // Lấy dữ liệu users từ model của Spring Boot
				
				$('#html_table').KTDatatable({
					data: {
						type: 'local', // Dữ liệu được load từ local (client-side)
						source: productData, // Truyền dữ liệu vào đây
						pageSize: 10, // Số lượng record trên mỗi trang
						saveState: { // Lưu trạng thái datatable vào localStorage
							cookie: true,
							webstorage: true,
						},
					},
					// layout definition
					layout: {
						scroll: false,
						footer: false,
					},

					// column sorting
					sortable: true,

					pagination: true,

					search: {
						input: $('#generalSearch'),
						delay: 500,
					},

					// columns definition
					columns: [
						{
							field: 'id',
							title: '#',
							sortable: 'asc',
							width: 40,
							type: 'number',
							selector: false,
							textAlign: 'center',
						},
						{
							field: 'name',
							title: 'Tên sản phẩm',
						},
						{
							field: 'versionName',
							title: 'Phiên bản',
						},
						{
							field: 'price',
							title: 'Giá bán',
						},
						// {
						// 	field: 'updatedAt',
						// 	title: 'updated_at',
						// 	type: 'date',
						// 	format: 'MM/DD/YYYY',
						// },
						// {
						// 	field: 'isDelete',
						// 	title: 'Status',
						// 	// callback function support for column rendering
						// 	template: function (row) {
						// 		var status = {
						// 			false: { 'title': 'Active', 'class': 'kt-badge--success' },
						// 			true: { 'title': 'Inactive', 'class': ' kt-badge--danger' },
						// 		};
						// 		return '<span class="kt-badge ' + status[row.isDelete].class + ' kt-badge--inline kt-badge--pill">' + status[row.isDelete].title + '</span>';
						// 	},
						// },
						{
							field: 'status',
							title: 'Trạng thái',
							// callback function support for column rendering
							template: function (row) {
								console.log(row);
								var status = {
									'Hết hàng': { 'title': 'Hết hàng', 'state': 'danger' },
									'Dang ban': { 'title': 'Đang bán', 'state': 'success' },
									'Sắp có': { 'title': 'Sắp có', 'state': 'accent' },
									'Ẩn trên webshop': { 'Ẩn trên webshop': 'Direct', 'state': 'primary' },
									'Ngừng kinh doanh': { 'Ngừng kinh doanh': 'Direct', 'state': 'accent' },
								};
								return '<span class="kt-badge kt-badge--' + status[row.status].state + ' kt-badge--dot"></span>&nbsp;<span class="kt-font-bold kt-font-' + status[row.status].state + '">' +
									status[row.status].title + '</span>';
							},
						},
						{
							field: 'Actions',
							title: 'Hành động',
							sortable: false,
							width: 130,
							// overflow: 'visible',
							textAlign: 'center',
							template: function (row, index, datatable) {
								var dropup = (datatable.getPageSize() - index) <= 4 ? 'dropup' : '';
								return '<div class="dropdown ' + dropup + ' ">\
		                        <a href="#" class="btn btn-clean btn-icon btn-pill " data-toggle="dropdown">\
		                            <i class="la la-ellipsis-h"></i>\
		                        </a>\
		                        <div class="dropdown-menu dropdown-menu-right" aria-labelledby="dropdown">\
		                            <a class="dropdown-item" href="#"><i class="la la-edit"></i> Edit Details</a>\
		                            <a class="dropdown-item" href="#"><i class="la la-leaf"></i> Update Status</a>\
		                            <a class="dropdown-item" href="#"><i class="la la-print"></i> Generate Report</a>\
		                        </div>\
		                    </div>\
		                    <a href="#" class="btn btn-clean btn-icon btn-pill" title="Edit details">\
		                        <i class="la la-edit"></i>\
		                    </a>\
		                    <a href="#" class="btn btn-clean btn-icon btn-pill" title="Delete">\
		                        <i class="la la-trash"></i>\
		                    </a>';
							},
						}
					],
				});
			});

		</script>
</body>

<!-- end::Body -->

</html>
